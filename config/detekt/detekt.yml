# TVProxy detekt configuration.
# buildUponDefaultConfig = true in build.gradle.kts, so this file only overrides defaults.
build:
  maxIssues: 0

config:
  validation: true

style:
  MagicNumber:
    active: false
  # Tests use descriptive underscore/backtick names (e.g. `parse_ignoresMalformedLines`);
  # allow them while keeping production naming strict.
  FunctionNaming:
    ignoreAnnotated: ['Test', 'Composable']
